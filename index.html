<body>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;
// ============================================================
//  데이터 영역
// ============================================================
// 정보처리기사 실기 모의고사 1~5회
// type: "short"(단답형 자동채점) | "essay"(약술형 모범답안) | "code"(코드 출력값 단답)
// answer: 정답(배열이면 복수 정답 인정), keywords: 약술형 채점 키워드

// ── 문제/이론 데이터는 로그인 후 Supabase 에서 로드된다 (번들에 데이터 없음) ──
let ALL_EXAMS = [], GICHUL_EXAMS = [], MOCK2_EXAMS = [], CARDS = [], COMPARE = [], MNEMONICS = [], CODE_CARDS = [];
function __hydrate(d) {
  ALL_EXAMS = d.all_exams || []; GICHUL_EXAMS = d.gichul_exams || []; MOCK2_EXAMS = d.mock2_exams || [];
  CARDS = d.cards || []; COMPARE = d.compare || []; MNEMONICS = d.mnemonics || []; CODE_CARDS = d.code_cards || [];
}


const SUBJECT_COLORS = {
  "소프트웨어 설계": "#6366f1",
  "소프트웨어 개발": "#0ea5e9",
  "데이터베이스 구축": "#10b981",
  "프로그래밍 언어 활용": "#f59e0b",
  "정보시스템 구축관리": "#ef4444",
};
const SUBJECTS = Object.keys(SUBJECT_COLORS);
const LANG_COLORS = { C: "#3b82f6", Java: "#f97316", Python: "#22c55e", SQL: "#a855f7" };

// ============================================================
//  공용 유틸
// ============================================================
function normalize(str) {
  return String(str).replace(/\s+/g, "").replace(/[;.,'"]/g, "").toLowerCase();
}
function gradeShort(userInput, answers) {
  if (!userInput) return false;
  const u = normalize(userInput);
  return answers.some((a) => normalize(a) === u);
}
function gradeEssay(userInput, keywords) {
  if (!userInput || !keywords) return { hit: 0, total: keywords?.length || 0, matched: [] };
  const u = userInput.replace(/\s+/g, "").toLowerCase();
  const matched = keywords.filter((k) => u.includes(k.replace(/\s+/g, "").toLowerCase()));
  return { hit: matched.length, total: keywords.length, matched };
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
//  메인 앱 (라우터)
// ============================================================
function App() {
  const [view, setView] = useState("main"); // main | exam | flash

  if (view === "exam") return <ExamApp onHome={() => setView("main")} />;
  if (view === "flash") return <FlashApp onHome={() => setView("main")} />;
  if (view === "gichul")
    return (
      <ExamApp
        onHome={() => setView("main")}
        exams={GICHUL_EXAMS}
        label="기출문제집"
        accent="#f59e0b"
        subtitle="2020~2025년 실기 기출 19회분 · 회당 20문제 (총 380문제)"
      />
    );
  if (view === "mock2")
    return (
      <ExamApp
        onHome={() => setView("main")}
        exams={MOCK2_EXAMS}
        label="모의고사"
        accent="#8b5cf6"
        subtitle="모의고사 23회분 · 회당 20문제 (총 460문제)"
      />
    );
  if (view === "code") return <CodeApp onHome={() => setView("main")} />;

  // ----- 메인 홈 -----
  return (
    <div style={S.page}>
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 34, paddingTop: 20 }}>
          <div style={{ fontSize: 52 }}>🎓</div>
          <h1 style={{ fontSize: 27, fontWeight: 800, margin: "10px 0 6px", letterSpacing: "-0.5px" }}>정보처리기사 실기 올인원</h1>
          <p style={{ color: "#94a3b8", margin: 0, fontSize: 14 }}>2026 출제기준 · 모의고사 + 이론 암기장</p>
        </div>

        <div style={{ display: "grid", gap: 16 }}>
          <button onClick={() => setView("exam")} style={{ ...S.bigCard, borderColor: "#6366f1" }}>
            <div style={{ fontSize: 38 }}>📝</div>
            <div style={{ textAlign: "left", flex: 1 }}>
              <div style={S.bigTitle}>AI 모의고사</div>
              <div style={S.bigDesc}>10회분 · 회당 20문제 (총 200문제)</div>
              <div style={S.bigSub}>단답·코드 자동채점 / 약술형 모범답안 비교</div>
            </div>
            <span style={S.arrow}>›</span>
          </button>

          <button onClick={() => setView("flash")} style={{ ...S.bigCard, borderColor: "#10b981" }}>
            <div style={{ fontSize: 38 }}>🧠</div>
            <div style={{ textAlign: "left", flex: 1 }}>
              <div style={S.bigTitle}>이론 암기장</div>
              <div style={S.bigDesc}>플래시카드 {CARDS.length}장 · 비교 {COMPARE.length}쌍 · 두문자 {MNEMONICS.length}개</div>
              <div style={S.bigSub}>탭하면 뒤집기 / 안다·다시 분류 학습</div>
            </div>
            <span style={S.arrow}>›</span>
          </button>

          <button onClick={() => setView("code")} style={{ ...S.bigCard, borderColor: "#06b6d4" }}>
            <div style={{ fontSize: 38 }}>💻</div>
            <div style={{ textAlign: "left", flex: 1 }}>
              <div style={S.bigTitle}>코드·SQL 개념노트</div>
              <div style={S.bigDesc}>{CODE_CARDS.length}장 · C·Java·Python·SQL 출력 맞히기 + 개념</div>
              <div style={S.bigSub}>코드 보고 결과 맞히기 / 언어별 문법 레퍼런스</div>
            </div>
            <span style={S.arrow}>›</span>
          </button>

          <button onClick={() => setView("gichul")} style={{ ...S.bigCard, borderColor: "#f59e0b" }}>
            <div style={{ fontSize: 38 }}>📄</div>
            <div style={{ textAlign: "left", flex: 1 }}>
              <div style={S.bigTitle}>기출문제집</div>
              <div style={S.bigDesc}>2020~2025년 실기 기출 19회분 (총 380문제)</div>
              <div style={S.bigSub}>실제 기출 + 이해하기 쉬운 상세 해설</div>
            </div>
            <span style={S.arrow}>›</span>
          </button>

          <button onClick={() => setView("mock2")} style={{ ...S.bigCard, borderColor: "#8b5cf6" }}>
            <div style={{ fontSize: 38 }}>🔥</div>
            <div style={{ textAlign: "left", flex: 1 }}>
              <div style={S.bigTitle}>모의고사</div>
              <div style={S.bigDesc}>23회분 · 회당 20문제 (총 460문제)</div>
              <div style={S.bigSub}>실전형 응용·코드 문제 + 풀이 해설</div>
            </div>
            <span style={S.arrow}>›</span>
          </button>
        </div>

        <div style={{ ...S.card, marginTop: 24 }}>
          <h3 style={{ margin: "0 0 12px", fontSize: 14, color: "#94a3b8" }}>📋 학습 가이드</h3>
          <ol style={{ margin: 0, paddingLeft: 18, fontSize: 13, color: "#cbd5e1", lineHeight: 2 }}>
            <li><b>이론 암기장</b>의 두문자로 핵심 목록 뼈대를 먼저 외우세요.</li>
            <li>플래시카드로 개념별 살을 붙이고 '다시' 카드만 반복하세요.</li>
            <li><b>AI 모의고사</b>로 회차별 실전 점검 → 60점 합격선 확인.</li>
          </ol>
        </div>

        <div style={{ textAlign: "center", marginTop: 20, fontSize: 11, color: "#475569" }}>
          모의고사 200 + 기출 380 + 모의고사 460문제 · 이론 {CARDS.length}개 · 코드·SQL {CODE_CARDS.length}개 수록
        </div>
      </div>
    </div>
  );
}

function ExamApp({ onHome, exams = ALL_EXAMS, label = "AI 모의고사", accent = "#6366f1", subtitle }) {
  const [phase, setPhase] = useState("home"); // home | exam | result
  const [roundIdx, setRoundIdx] = useState(0);
  const [current, setCurrent] = useState(0);
  const [inputs, setInputs] = useState({});
  const [confirmed, setConfirmed] = useState({});

  const exam = exams[roundIdx];
  const questions = exam.questions;
  const q = questions[current];

  const answeredCount = useMemo(
    () => questions.filter((_, i) => (inputs[`${roundIdx}_${i}`] || "").trim() !== "").length,
    [inputs, questions, roundIdx]
  );

  function key(i) {
    return `${roundIdx}_${i}`;
  }

  function startRound(idx) {
    setRoundIdx(idx);
    setCurrent(0);
    setPhase("exam");
  }

  function setInput(val) {
    setInputs((prev) => ({ ...prev, [key(current)]: val }));
  }

  function confirmCurrent() {
    setConfirmed((prev) => ({ ...prev, [key(current)]: true }));
  }

  function nextQ() {
    if (current < questions.length - 1) setCurrent(current + 1);
  }
  function prevQ() {
    if (current > 0) setCurrent(current - 1);
  }

  // 결과 계산: 단답/코드만 자동 채점, 약술형은 키워드 70% 이상이면 정답 처리(참고용)
  function computeResult() {
    let correct = 0;
    const detail = questions.map((qq, i) => {
      const u = inputs[key(i)] || "";
      let ok = false;
      let essayInfo = null;
      if (qq.type === "essay") {
        essayInfo = gradeEssay(u, qq.keywords);
        ok = essayInfo.total > 0 && essayInfo.hit / essayInfo.total >= 0.7;
      } else {
        ok = gradeShort(u, qq.answer);
      }
      if (ok) correct++;
      return { i, ok, essayInfo, user: u };
    });
    return { correct, detail };
  }

  // ---------- HOME ----------
  if (phase === "home") {
    return (
      <div style={S.page}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <button onClick={onHome} style={{ ...S.linkBtn, marginBottom: 8 }}>← 메인 메뉴</button>
          <div style={{ textAlign: "center", marginBottom: 28 }}>
            <div style={{ fontSize: 46 }}>📝</div>
            <h1 style={{ fontSize: 26, fontWeight: 800, margin: "8px 0 4px" }}>정보처리기사 {label}</h1>
            <p style={{ color: "#94a3b8", margin: 0, fontSize: 14 }}>{subtitle || "2026 출제기준 · 10회분 · 회당 20문제 (총 200문제)"}</p>
            <p style={{ color: "#64748b", margin: "6px 0 0", fontSize: 12 }}>단답형·코드형 자동 채점 / 약술형 모범답안 비교</p>
          </div>

          <div style={{ display: "grid", gap: 12 }}>
            {exams.map((ex, idx) => {
              const codeCnt = ex.questions.filter((x) => x.type === "code").length;
              const essayCnt = ex.questions.filter((x) => x.type === "essay").length;
              const shortCnt = ex.questions.length - codeCnt - essayCnt;
              return (
                <button key={idx} onClick={() => startRound(idx)} style={S.roundCard}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                      <div style={{ ...S.roundNum, background: `linear-gradient(135deg, ${accent}, #8b5cf6)` }}>{ex.badge || (ex.round + "회")}</div>
                      <div style={{ textAlign: "left" }}>
                        <div style={{ fontSize: 15, fontWeight: 700 }}>{ex.title || (label + " " + ex.round + "회차")}</div>
                        <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 2 }}>
                          코드 {codeCnt} · 단답 {shortCnt} · 약술 {essayCnt}
                        </div>
                      </div>
                    </div>
                    <span style={{ color: "#6366f1", fontSize: 20 }}>›</span>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ---------- RESULT ----------
  if (phase === "result") {
    const { correct, detail } = computeResult();
    const autoTotal = questions.filter((x) => x.type !== "essay").length;
    const essayTotal = questions.filter((x) => x.type === "essay").length;
    const pct = Math.round((correct / questions.length) * 100);
    const pass = pct >= 60;

    const subjectScore = {};
    Object.keys(SUBJECT_COLORS).forEach((sub) => {
      const idxs = questions.map((qq, i) => ({ qq, i })).filter((x) => x.qq.subject === sub);
      const c = idxs.filter((x) => detail[x.i].ok).length;
      if (idxs.length) subjectScore[sub] = { c, t: idxs.length };
    });

    return (
      <div style={S.page}>
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <div style={S.examCard}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 50 }}>{pass ? "🎉" : "💪"}</div>
              <h2 style={{ fontSize: 22, fontWeight: 800, margin: "6px 0" }}>{exam.title || (exam.round + "회차")} 결과</h2>
              <div style={{ fontSize: 56, fontWeight: 900, color: pass ? "#34d399" : "#f87171", margin: "10px 0" }}>{pct}점</div>
              <div style={{ color: "#cbd5e1", fontSize: 15 }}>{correct} / {questions.length} 정답</div>
              <div style={{ fontSize: 12, color: "#64748b", marginTop: 6 }}>
                자동채점 {autoTotal}문제 · 약술형 {essayTotal}문제(키워드 기준 참고채점)
              </div>
              <div style={{ ...S.badge, background: pass ? "rgba(52,211,153,.2)" : "rgba(248,113,113,.2)", color: pass ? "#34d399" : "#f87171", marginTop: 12 }}>
                {pass ? "✅ 합격권 (60점 이상)" : "❌ 불합격권 (60점 미만)"}
              </div>
            </div>
          </div>

          <div style={S.examCard}>
            <h3 style={S.cardTitle}>과목별 성적</h3>
            {Object.entries(subjectScore).map(([sub, { c, t }]) => (
              <div key={sub} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5, fontSize: 13 }}>
                  <span>{sub}</span>
                  <span style={{ color: SUBJECT_COLORS[sub], fontWeight: 700 }}>{c}/{t}</span>
                </div>
                <div style={S.barBg}>
                  <div style={{ ...S.barFill, width: `${(c / t) * 100}%`, background: SUBJECT_COLORS[sub] }} />
                </div>
              </div>
            ))}
          </div>

          <div style={S.examCard}>
            <h3 style={S.cardTitle}>문제별 정오답 (탭하여 해설 보기)</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 8 }}>
              {questions.map((qq, i) => {
                const ok = detail[i].ok;
                const isEssay = qq.type === "essay";
                return (
                  <div key={i} onClick={() => { setCurrent(i); setConfirmed((p) => ({ ...p, [key(i)]: true })); setPhase("exam"); }}
                    style={{ ...S.gridCell, borderColor: ok ? "#34d399" : isEssay ? "#fbbf24" : "#f87171", background: ok ? "rgba(52,211,153,.15)" : isEssay ? "rgba(251,191,36,.12)" : "rgba(248,113,113,.15)" }}>
                    <div style={{ fontSize: 11, color: "#94a3b8" }}>{i + 1}번</div>
                    <div style={{ fontSize: 16 }}>{ok ? "✅" : isEssay ? "📝" : "❌"}</div>
                  </div>
                );
              })}
            </div>
            <p style={{ fontSize: 11, color: "#64748b", marginTop: 12, lineHeight: 1.6 }}>
              📝 = 약술형(직접 모범답안과 비교). 키워드 70% 이상 포함 시 자동 정답 처리되며, 실제 시험에서는 부분점수가 부여됩니다.
            </p>
          </div>

          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => { setInputs({}); setConfirmed({}); setCurrent(0); setPhase("exam"); }} style={{ ...S.btn, ...S.btnGhost, flex: 1 }}>다시 풀기</button>
            <button onClick={() => { setPhase("home"); }} style={{ ...S.btn, ...S.btnPrimary, flex: 1 }}>회차 선택으로</button>
          </div>
        </div>
      </div>
    );
  }

  // ---------- EXAM ----------
  const isConfirmed = !!confirmed[key(current)];
  const userVal = inputs[key(current)] || "";
  const autoOk = q.type !== "essay" ? gradeShort(userVal, q.answer) : null;
  const essayInfo = q.type === "essay" ? gradeEssay(userVal, q.keywords) : null;

  return (
    <div style={S.page}>
      <div style={{ maxWidth: 760, margin: "0 auto" }}>
        {/* header */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
          <button onClick={() => setPhase("home")} style={S.linkBtn}>← 회차</button>
          <h2 style={{ margin: 0, fontSize: 15, color: "#a5b4fc" }}>{exam.title || (exam.round + "회차")} · {current + 1}/{questions.length}</h2>
          <span style={{ fontSize: 13, color: "#94a3b8" }}>{answeredCount}/{questions.length} 입력</span>
        </div>

        {/* progress dots */}
        <div style={{ display: "flex", gap: 4, marginBottom: 18, flexWrap: "wrap" }}>
          {questions.map((qq, i) => {
            const ans = (inputs[key(i)] || "").trim() !== "";
            return (
              <button key={i} onClick={() => setCurrent(i)}
                style={{ ...S.dot, background: i === current ? "#6366f1" : confirmed[key(i)] ? "#475569" : ans ? "#f59e0b" : "rgba(255,255,255,.1)" }}>
                {i + 1}
              </button>
            );
          })}
        </div>

        {/* question */}
        <div style={S.examCard}>
          <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
            <span style={{ ...S.tag, background: q.type === "code" ? "rgba(251,191,36,.2)" : q.type === "essay" ? "rgba(168,85,247,.2)" : "rgba(99,102,241,.2)", color: q.type === "code" ? "#fbbf24" : q.type === "essay" ? "#c084fc" : "#a5b4fc" }}>
              {q.type === "code" ? "💻 코드" : q.type === "essay" ? "✍️ 약술형" : "✏️ 단답형"}
            </span>
            <span style={{ ...S.tag, background: `${SUBJECT_COLORS[q.subject]}22`, color: SUBJECT_COLORS[q.subject] }}>{q.subject}</span>
            {q.lang && <span style={{ ...S.tag, background: `${LANG_COLORS[q.lang]}22`, color: LANG_COLORS[q.lang] }}>{q.lang}</span>}
          </div>

          <p style={{ fontSize: 15.5, lineHeight: 1.75, margin: "0 0 16px", whiteSpace: "pre-line" }}>
            <strong>{q.no}.</strong> {q.q}
          </p>

          {q.code && <pre style={S.code}>{q.code}</pre>}

          {/* input */}
          {q.type === "essay" ? (
            <textarea value={userVal} onChange={(e) => setInput(e.target.value)} disabled={isConfirmed}
              placeholder="답안을 서술하세요 (핵심 키워드 위주로 작성)" rows={4} style={S.textarea} />
          ) : (
            <input value={userVal} onChange={(e) => setInput(e.target.value)} disabled={isConfirmed}
              placeholder={q.type === "code" ? "출력 결과를 입력하세요" : "정답을 입력하세요"} style={S.input}
              onKeyDown={(e) => { if (e.key === "Enter" && userVal.trim() && !isConfirmed) confirmCurrent(); }} />
          )}

          {/* feedback */}
          {isConfirmed && q.type !== "essay" && (
            <div style={{ ...S.feedback, background: autoOk ? "rgba(52,211,153,.12)" : "rgba(248,113,113,.12)", borderColor: autoOk ? "#34d399" : "#f87171" }}>
              <div style={{ fontWeight: 700, color: autoOk ? "#34d399" : "#f87171", marginBottom: 6, fontSize: 14 }}>
                {autoOk ? "⭕ 정답" : "❌ 오답"}
              </div>
              <div style={{ fontSize: 13.5, color: "#e2e8f0", marginBottom: 4 }}>
                <strong>정답:</strong> {q.answer.slice(0, 3).join(" / ")}
              </div>
              <div style={{ fontSize: 13, color: "#cbd5e1", lineHeight: 1.6 }}>💡 {q.explanation}</div>
            </div>
          )}

          {isConfirmed && q.type === "essay" && (
            <div style={{ ...S.feedback, background: "rgba(168,85,247,.1)", borderColor: "#a855f7" }}>
              <div style={{ fontWeight: 700, color: "#c084fc", marginBottom: 8, fontSize: 14 }}>
                ✍️ 모범답안 비교 (키워드 {essayInfo.hit}/{essayInfo.total} 포함)
              </div>
              <div style={{ fontSize: 13.5, color: "#e2e8f0", lineHeight: 1.7, marginBottom: 10, background: "rgba(0,0,0,.25)", padding: 12, borderRadius: 8 }}>
                {q.modelAnswer}
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {q.keywords.map((k) => {
                  const hit = essayInfo.matched.includes(k);
                  return <span key={k} style={{ fontSize: 11, padding: "3px 9px", borderRadius: 12, background: hit ? "rgba(52,211,153,.2)" : "rgba(255,255,255,.08)", color: hit ? "#34d399" : "#64748b" }}>{hit ? "✓ " : ""}{k}</span>;
                })}
              </div>
            </div>
          )}
        </div>

        {/* controls */}
        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <button onClick={prevQ} disabled={current === 0} style={{ ...S.btn, ...S.btnGhost, flex: 1, opacity: current === 0 ? 0.4 : 1 }}>← 이전</button>
          {!isConfirmed ? (
            <button onClick={confirmCurrent} disabled={!userVal.trim()} style={{ ...S.btn, ...S.btnPrimary, flex: 2, opacity: userVal.trim() ? 1 : 0.5 }}>
              {q.type === "essay" ? "모범답안 확인" : "정답 확인"}
            </button>
          ) : (
            <button onClick={current === questions.length - 1 ? () => setPhase("result") : nextQ} style={{ ...S.btn, ...S.btnGreen, flex: 2 }}>
              {current === questions.length - 1 ? "📊 채점 결과 보기" : "다음 →"}
            </button>
          )}
        </div>

        {answeredCount >= 1 && (
          <button onClick={() => setPhase("result")} style={{ ...S.btn, width: "100%", background: "rgba(239,68,68,.12)", border: "1px solid rgba(239,68,68,.4)", color: "#f87171" }}>
            지금 채점하기 ({answeredCount}/{questions.length} 입력)
          </button>
        )}
      </div>
    </div>
  );
}


function FlashApp({ onHome }) {
  const [mode, setMode] = useState("home"); // home | flashcard | compare | mnemonic
  const [subject, setSubject] = useState("ALL");
  const [shuffled, setShuffled] = useState(false);

  // flashcard state
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState({}); // front -> true(앎)/false(다시)

  const deck = useMemo(() => {
    let d = subject === "ALL" ? CARDS : CARDS.filter((c) => c.sub === subject);
    return shuffled ? shuffle(d) : d;
  }, [subject, shuffled]);

  const card = deck[idx];
  const knownCount = deck.filter((c) => known[c.front] === true).length;
  const reviewCount = deck.filter((c) => known[c.front] === false).length;

  function reset() {
    setIdx(0);
    setFlipped(false);
  }
  function go(dir) {
    setFlipped(false);
    setIdx((p) => Math.min(Math.max(p + dir, 0), deck.length - 1));
  }
  function mark(val) {
    setKnown((p) => ({ ...p, [card.front]: val }));
    if (idx < deck.length - 1) go(1);
    else setFlipped(false);
  }

  // ---------- HOME ----------
  if (mode === "home") {
    return (
      <div style={S.page}>
        <div style={{ maxWidth: 640, margin: "0 auto" }}>
          <button onClick={onHome} style={{ ...S.linkBtn, marginBottom: 8 }}>← 메인 메뉴</button>

            <div style={{ fontSize: 46 }}>🧠</div>
            <h1 style={{ fontSize: 25, fontWeight: 800, margin: "8px 0 4px" }}>정보처리기사 이론 암기장</h1>

                <div style={S.menuTitle}>암기 플래시카드</div>
                <div style={S.menuDesc}>{CARDS.length}장 · 탭하면 뒤집기 · 안다/다시 분류</div>
              </div>
              <span style={S.arrow}>›</span>

            <button onClick={() => setMode("compare")} style={{ ...S.menuCard, borderColor: "#f59e0b" }}>

              <li>플래시카드는 '다시' 표시한 것만 반복 학습하면 효율적입니다.</li>

            </ul>
          </div>
        </div>
      </div>
    );

  // ---------- FLASHCARD ----------
  if (mode === "flashcard") {
    return (
      <div style={S.page}>
        <div style={{ maxWidth: 640, margin: "0 auto" }}>
          <div style={S.topBar}>
            <button onClick={() => setMode("home")} style={S.linkBtn}>← 메뉴</button>
            <span style={{ fontSize: 14, color: "#a5b4fc" }}>{idx + 1} / {deck.length}</span>
            <button onClick={() => { setShuffled((s) => !s); reset(); }} style={{ ...S.linkBtn, color: shuffled ? "#34d399" : "#94a3b8" }}>
              {shuffled ? "🔀 섞임" : "🔀 섞기"}

            <button onClick={() => { setKnown({}); reset(); }} style={{ ...S.btn, width: "100%", marginTop: 12, background: "rgba(6,182,212,.12)", border: "1px solid rgba(6,182,212,.4)", color: "#67e8f9" }}>
              진도 초기화
            </button>
          )}
        </div>
      </div>
    );
  }

  // ---------- REFERENCE ----------
  const refList = lang === "ALL" ? CODE_CARDS : CODE_CARDS.filter((c) => c.lang === lang);
  return (
    <div style={S.page}>
      <div style={{ maxWidth: 680, margin: "0 auto" }}>
        <div style={S.topBar}>
          <button onClick={() => setMode("home")} style={S.linkBtn}>← 메뉴</button>
          <h2 style={{ margin: 0, fontSize: 16, color: "#c084fc" }}>📖 개념 레퍼런스</h2>
          <span style={{ width: 40 }} />
        </div>

        {/* lang filter */}
        <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
          <button onClick={() => setLang("ALL")} style={{ ...S.chip, ...(lang === "ALL" ? S.chipActive : {}) }}>전체</button>
          {LANGS.map((l) => (
            <button key={l} onClick={() => setLang(l)}
              style={{ ...S.chip, ...(lang === l ? { background: LANG_COLORS[l], color: "#fff", borderColor: LANG_COLORS[l] } : {}) }}>
              {l}
            </button>
          ))}
        </div>

        <div style={{ display: "grid", gap: 12 }}>
          {refList.map((c, i) => (
            <div key={i} style={S.card}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
                <span style={{ ...S.tag, background: `${LANG_COLORS[c.lang]}22`, color: LANG_COLORS[c.lang] }}>{c.lang}</span>
                <span style={{ fontSize: 11.5, color: "#64748b" }}>{c.cat}</span>
                <span style={{ fontSize: 14.5, fontWeight: 700, color: "#e2e8f0" }}>{c.title}</span>
              </div>
              <pre style={{ ...S.code, marginBottom: 10 }}>{c.code}</pre>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
                <span style={{ fontSize: 12, color: "#94a3b8" }}>결과</span>
                <span style={{ fontSize: 15, fontWeight: 800, color: "#67e8f9" }}>{c.out}</span>
              </div>
              <div style={{ fontSize: 13, color: "#cbd5e1", lineHeight: 1.6 }}>💡 {c.note}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const __sb = supabase.createClient(__SB_URL, __SB_ANON);

const __center = { minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#94a3b8", font:"500 15px 'Noto Sans KR',sans-serif", background:"linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#1e3a5f 100%)", padding:20, boxSizing:"border-box" };
const __inp = { width:"100%", padding:"11px 12px", marginBottom:12, borderRadius:10, border:"1px solid rgba(255,255,255,.15)", background:"rgba(0,0,0,.25)", color:"#f1f5f9", font:"400 14px 'Noto Sans KR',sans-serif", boxSizing:"border-box" };

function Gate() {
  const [session, setSession] = useState(undefined); // undefined=확인중, null=로그아웃, obj=로그인
  const [ready, setReady] = useState(false);
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    __sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = __sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setReady(false); return; }
    let alive = true;
    (async () => {
      const { data, error } = await __sb.from("study_data").select("key,payload");
      if (!alive) return;
      if (error) { setErr("데이터 로드 실패: " + error.message); return; }
      const m = {}; (data || []).forEach((r) => { m[r.key] = r.payload; });
      __hydrate(m);
      setReady(true);
    })();
    return () => { alive = false; };
  }, [session]);

  async function onLogin(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    const { error } = await __sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr("로그인 실패 — 이메일/비밀번호를 확인하세요.");
  }
  async function onLogout() { await __sb.auth.signOut(); setReady(false); }

  if (session === undefined) return <div style={__center}>불러오는 중…</div>;

  if (!session) {
    return (
      <div style={__center}>
        <form onSubmit={onLogin} style={{ width:"100%", maxWidth:340, background:"rgba(255,255,255,.04)", border:"1px solid rgba(255,255,255,.12)", borderRadius:16, padding:28, boxSizing:"border-box" }}>
          <div style={{ color:"#f1f5f9", font:"900 22px 'Noto Sans KR',sans-serif", marginBottom:6 }}>정보처리기사 올인원</div>
          <div style={{ color:"#94a3b8", fontSize:13, marginBottom:20 }}>로그인이 필요합니다</div>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="이메일" autoComplete="username" style={__inp} />
          <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="비밀번호" autoComplete="current-password" style={__inp} />
          {err ? <div style={{ color:"#f87171", fontSize:13, margin:"2px 0 12px" }}>{err}</div> : null}
          <button type="submit" disabled={busy} style={{ width:"100%", padding:"12px", borderRadius:10, border:"none", background:"#6366f1", color:"#fff", font:"700 15px 'Noto Sans KR',sans-serif", cursor:"pointer", opacity: busy ? 0.6 : 1 }}>
            {busy ? "로그인 중…" : "로그인"}
          </button>
        </form>
      </div>
    );
  }

  if (!ready) return <div style={__center}>{err || "데이터 불러오는 중…"}</div>;

  return (
    <React.Fragment>
      <App />
      <button onClick={onLogout} title="로그아웃" style={{ position:"fixed", top:12, right:12, zIndex:9999, padding:"6px 12px", borderRadius:999, background:"rgba(15,23,42,.7)", backdropFilter:"blur(8px)", border:"1px solid rgba(255,255,255,.18)", color:"#cbd5e1", font:"600 12px 'Noto Sans KR',sans-serif", cursor:"pointer" }}>
        로그아웃
      </button>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Gate />);
